<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediaFlow Manager</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #fff;
      text-align: center;
    }
    .container {
      padding: 80px 20px;
    }
    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }
    p {
      font-size: 18px;
      color: #cbd5f5;
      max-width: 600px;
      margin: 0 auto 30px;
    }
    .btn {
      background: #6366f1;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      border-radius: 8px;
      display: inline-block;
      margin-top: 20px;
    }
    .footer {
      margin-top: 80px;
      font-size: 14px;
      color: #94a3b8;
    }
    a {
      color: #818cf8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>MediaFlow Manager</h1>
    <p>
      Manage and schedule video content across platforms. 
      Upload, organize, and publish videos easily from one dashboard.
    </p>

    <a href="#" class="btn" onclick="connectTikTok()">Connect TikTok</a>
    <div id="loader" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; align-items:center; justify-content:center; flex-direction:column;">
  <div class="spinner"></div>
  <p style="margin-top:20px;">Connecting to TikTok...</p>
</div>

<style>
.spinner {
  border: 6px solid #1e293b;
  border-top: 6px solid #6366f1;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>

<script>
function connectTikTok() {
  document.getElementById('loader').style.display = 'flex';

  setTimeout(() => {
    window.location.href = "dashboard.html";
  }, 2000);
}
</script>

    <div class="footer">
      <p>
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a>
      </p>
    </div>
  </div>
</body>
</html>
